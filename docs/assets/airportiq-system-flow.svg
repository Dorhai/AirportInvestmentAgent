  <text x="598" y="800" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d8dee6">Universe TTL snapshot</text>
  <rect x="308" y="840" width="220" height="44" rx="4" fill="#3a414c" stroke="#4b5563"/>
  <text x="418" y="868" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d8dee6">Scoring expansion_score.py</text>

  <line x1="438" y1="352" x2="380" y2="692" stroke="#9aa3ad" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="348" y1="584" x2="380" y2="692" stroke="#9aa3ad" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="380" y1="736" x2="218" y2="772" stroke="#9aa3ad" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="380" y1="736" x2="418" y2="772" stroke="#9aa3ad" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="380" y1="736" x2="598" y2="772" stroke="#9aa3ad" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="418" y1="816" x2="418" y2="840" stroke="#9aa3ad" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="348" y1="584" x2="598" y2="772" stroke="#9aa3ad" stroke-width="1.2" opacity="0.7" marker-end="url(#a)"/>

  <!-- SSE back to UI -->
  <path d="M680 478 C 980 478, 1000 94, 670 94" fill="none" stroke="#9aa3ad" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="860" y="300" width="200" height="36" rx="3" fill="#1f242c" stroke="#3d4450"/>
  <text x="960" y="323" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c5ccd4">SSE: phase, meta, delta, done</text>

  <line x1="590" y1="500" x2="348" y2="536" stroke="#9aa3ad" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="590" y1="500" x2="572" y2="536" stroke="#9aa3ad" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="590" y1="500" x2="816" y2="536" stroke="#9aa3ad" stroke-width="1.4" marker-end="url(#a)"/>

